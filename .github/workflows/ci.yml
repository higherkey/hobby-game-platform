name: CI Pipeline

on:
  push:
    branches: [main, dev, feat/*, fix/*]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate & Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Clean Install Dependencies
        run: npm ci

      - name: TypeScript Type Checking
        run: npx tsc --noEmit

      - name: Run Unit Test Suite
        run: npm test

      - name: Production Bundle Verification (Render Build Command)
        run: npm ci --include=dev && npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run End-to-End Test Suite
        run: npm run test:e2e

      - name: Dependency Security Audit
        run: npm audit --audit-level=high

  render-build-check:
    name: Render Production Build Simulation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Execute Render Build Command
        run: npm ci --include=dev && npm run build

      - name: Verify Build Artifacts Integrity
        run: |
          test -f dist/index.html
          test -d dist/assets
          echo "Render production build artifacts successfully verified."
