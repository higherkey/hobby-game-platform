services:
  - type: web
    name: hobby-game-server
    env: node
    plan: free
    healthCheckPath: /health
    buildCommand: npm install
    startCommand: npm run server
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hobby-game-db
          property: connectionString

databases:
  - name: hobby-game-db
    databaseName: hobby_games
    user: hobby_user
    plan: free
